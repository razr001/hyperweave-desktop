name: HyperWeave Desktop

on:
  push:
    branches: [codex/hyperweave-desktop]
    paths:
      - 'dsh-desktop-next/**'
      - '.github/workflows/hyperweave-desktop.yml'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperweave-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: HyperWeave Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ARM64 hosted macOS capacity has failed before any job steps could run.
        os: [windows-latest, ubuntu-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn install --immutable
      - name: Typecheck and focused client tests
        run: |
          yarn typecheck
          yarn test
      - name: Build and verify HyperWeave package
        run: |
          yarn dist
          yarn verify:package
      - name: Verify renderer network boundary
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum yarn verify:desktop
      - name: Verify renderer network boundary
        if: runner.os != 'Linux'
        run: yarn verify:desktop
